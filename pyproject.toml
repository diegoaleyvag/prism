[project]
name = "prism"
version = "0.1.0"
description = "A reproducible workbench for evaluating task-specific model tradeoffs — synthetic, deterministic, transparent."
readme = "README.md"
requires-python = "==3.13.*"
license = { text = "Apache-2.0" }
authors = [{ name = "atomicz" }]
keywords = ["evaluation", "benchmark", "reproducibility", "synthetic", "llm"]

dependencies = [
    "pydantic>=2.9,<3",
    "polars>=1.9,<2",
    "duckdb>=1.1,<2",
    "pyarrow>=17,<22",
    "numpy>=2.0,<3",
    "typer>=0.12,<1",
    "jsonschema>=4.23,<5",
]

[project.scripts]
prism = "prism.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.112,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-jsonschema>=4.23,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["prism"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
